<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>RAPID | Help decide what gets built next</title>
    <meta
      name="description"
      content="Share your experience in short research tasks and help founders test products for people like you. Request your invite to the RAPID pilot."
    />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RAPID | Help decide what gets built next" />
    <meta
      property="og:description"
      content="Share your experience in short research tasks and help founders test products for people like you."
    />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:site_name" content="RAPID" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RAPID | Help decide what gets built next" />
    <meta
      name="twitter:description"
      content="Share your experience in short research tasks and help founders test products for people like you."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />

    <!-- Canonical -->
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "RAPID",
        "url": "%SITE_URL%/",
        "description": "RAPID helps founders test products with people who face the problem they want to solve."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
